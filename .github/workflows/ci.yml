name: ci

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: install dependencies
        run: npm ci

      - name: check format and linting
        run: npm run lint

      - name: check types
        run: npm run typecheck

      - name: run tests
        run: npm test

      # Packages take whatever 0.x kernel an app has, so they are also tested against the newest one.
      - name: run tests against the latest kernel
        run: |
          npm install --no-save @raptor-js/kernel@latest
          npm test
